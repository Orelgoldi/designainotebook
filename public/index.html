<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סיכומי הרצאות | Design AI 7.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #041042;
      --purple: #981fb6;
      --cyan:   #2cffdf;
      --white:  #ffffff;
      --muted:  rgba(255,255,255,0.5);
      --card:   rgba(255,255,255,0.055);
      --border: rgba(255,255,255,0.1);
    }
    html, body { min-height: 100dvh; }
    body {
      font-family: 'Assistant', sans-serif;
      background: var(--navy);
      color: var(--white);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Background ── */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background: radial-gradient(ellipse at 15% 85%, #06083a 0%, var(--navy) 60%); }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; animation: drift 14s ease-in-out infinite alternate; }
    .blob-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(152,31,182,0.55), transparent 70%); top: -150px; right: -100px; }
    .blob-2 { width: 320px; height: 320px; background: radial-gradient(circle, rgba(44,255,223,0.3), transparent 70%); bottom: -80px; left: -80px; animation-delay: -5s; animation-duration: 11s; }
    @keyframes drift { from{transform:translate(0,0)} to{transform:translate(24px,18px)} }
    .grid-bg { position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.022) 1px,transparent 1px);
      background-size: 52px 52px; }

    /* ── Header ── */
    header {
      position: relative; z-index: 10;
      padding: 40px 24px 0;
      max-width: 1100px; margin: 0 auto;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .logo { width: 100px; filter: brightness(0) invert(1); margin-bottom: 24px; }
    .badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(152,31,182,0.12); border: 1px solid rgba(152,31,182,0.35);
      border-radius: 20px; padding: 6px 14px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.7); margin-bottom: 18px;
    }
    .badge-dot { width: 6px; height: 6px; background: var(--purple); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    h1 { font-size: clamp(30px,5vw,46px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 12px; }
    h1 .gr { background: linear-gradient(135deg, var(--cyan), #b06bef); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { font-size: 16px; color: var(--muted); max-width: 480px; line-height: 1.7; margin-bottom: 48px; }

    /* ── Grid ── */
    .grid-wrap { position: relative; z-index: 2; max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }
    .speaker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
    @media (max-width: 900px) { .speaker-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 620px) { .speaker-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

    /* ── Speaker card ── */
    .sp-card {
      position: relative; border-radius: 18px; overflow: hidden;
      cursor: pointer; text-decoration: none; display: block;
      color: var(--white);
      background: rgba(8,10,50,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .sp-card:hover { transform: translateY(-6px); border-color: rgba(152,31,182,0.55); box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(152,31,182,0.2); }
    .sp-photo { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; display: block; }
    .sp-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(4,4,40,0.97) 0%, rgba(4,4,40,0.75) 55%, transparent 100%);
      padding: 40px 14px 16px;
    }
    .sp-name { font-size: 13px; font-weight: 800; line-height: 1.3; margin-bottom: 3px; }
    .sp-role { font-size: 10.5px; color: var(--muted); line-height: 1.35; margin-bottom: 10px; }
    .sp-talk {
      font-size: 10px; color: var(--cyan); font-weight: 700;
      letter-spacing: 0.04em; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .sp-cta {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.6);
    }
    .sp-cta-arrow { font-size: 14px; color: var(--cyan); }
    .sp-no-pdf { color: rgba(255,255,255,0.3); }

    /* ── Footer ── */
    footer { position: relative; z-index: 2; text-align: center; padding-bottom: 32px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="grid-bg"></div>
</div>

<header>
  <img src="/logo.svg" class="logo" alt="Design AI">
  <div class="badge"><span class="badge-dot"></span>DESIGN AI 7.0 · 2026</div>
  <h1>סיכומי<br><span class="gr">הרצאות הכנס</span></h1>
  <p class="subtitle">כל סיכומי ההרצאות מכנס Design AI 7.0 במקום אחד — לחצו על מרצה לצפייה</p>
</header>

<div class="grid-wrap">
  <div class="speaker-grid" id="speakerGrid"></div>
</div>

<footer>Design AI 7.0 · 2026 · כל הזכויות שמורות</footer>

<script>
  const SPEAKERS = [
    { id: 'daniel',   name: 'דניאל בוארון',         role: 'מייסד DESIGN AI',                          img: '/speakers/daniel.png',    talk: 'דברי פתיחה — DESIGN TO CODE', url: 'https://danielboaron23.github.io/d2c-conference/links.html' },
    { id: 'omri',     name: 'עומרי הרמן',            role: 'Founder at Spring',                         img: 'https://designai.co.il/wp-content/uploads/2026/04/%D7%A2%D7%9E%D7%A8%D7%99.png', talk: 'The Product is The New Workspace' },
    { id: 'gal',      name: 'גל דולב',               role: 'AI Lead & PM @Guidde',                      img: '/speakers/gal.png',       talk: '3 עקרונות קריטיים לבניית חוויות משתמש טובות בעידן ה-AI', url: '/gal-summary.html' },
    { id: 'tal',      name: 'טל זגורי',              role: 'AI Storyteller | מנהל מוצר',               img: '/speakers/tal.png',       talk: 'סטוריטלינג בעולם החדש: איך למכור את הרעיונות שלכם ב-2 דקות?' },
    { id: 'shira',    name: 'שירה וינברג הראל',      role: 'Product and AI Expert, Beyond AI',          img: '/speakers/shira.png',     talk: 'מנטור לכל עובד.ת: איך לייצר נבחרת מנטורים פנים-ארגונית בעזרת AI' },
    { id: 'yaakov',   name: 'ד"ר יעקב גרינשפן',     role: 'UX Strategy',                               img: '/speakers/yaakov.png',    talk: 'אהבה, אמון, AI: איך לבנות אפליקציות מבוססות AI שאנשים יאהבו', url: 'https://www.uxux.co.il/trusttalk' },
    { id: 'ron',      name: 'רון ברנוב',             role: 'Creative Workflow Advocate, Weavy',          img: '/speakers/ron.png',       talk: 'Workflow First: כך מעצבים תהליך יצירתי עם AI ו-Weavy' },
    { id: 'sheli',    name: 'שלי אור גיסר',          role: 'Gen AI Design Lead, GITAM BBDO',            img: '/speakers/sheli.png',     talk: 'Creative Engineering — הנדסת חשיבה עיצובית למוצר' },
    { id: 'ido',      name: 'עידו זייפמן וקרן שגב',  role: 'Co-Founder & Co-CEO, Kido',                 img: '/speakers/ido-keren.png', talk: 'סוף כל סוף העבודה הידנית ב-Design System' },
    { id: 'inbal',    name: 'ענבל ברקוביץ',          role: 'Head of UX, Ocean',                          img: '/speakers/inbal.png',     talk: 'עיצוב בעידן ה-GenUI: פרק חדש באבולוציה של האינטרקציה' },
  ];

  let availablePdfs = [];

  async function init() {
    try {
      const res = await fetch('/api/pdfs');
      availablePdfs = await res.json();
    } catch { availablePdfs = []; }
    renderGrid();
  }

  function renderGrid() {
    document.getElementById('speakerGrid').innerHTML = SPEAKERS.map(sp => {
      const hasContent = sp.url || availablePdfs.includes(sp.id + '.pdf');
      return `
        <a class="sp-card" href="/speaker.html?id=${sp.id}">
          <img class="sp-photo" src="${sp.img}" alt="${sp.name}" loading="lazy" onerror="this.style.background='#1a1d4e'">
          <div class="sp-overlay">
            <div class="sp-name">${sp.name}</div>
            <div class="sp-role">${sp.role}</div>
            <div class="sp-talk">${sp.talk}</div>
            <div class="sp-cta">
              <span>${hasContent ? 'צפה בסיכום' : '<span class="sp-no-pdf">בקרוב</span>'}</span>
              ${hasContent ? '<span class="sp-cta-arrow">←</span>' : ''}
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  init();
</script>
</body>
</html>
